
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <link rel="stylesheet" href="expense.css">

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <h1>Expense Tracker</h1>

    <div class="card">
        <h2>Add Expense</h2>

        <form id="expenseForm">
            <input type="number" id="amount" placeholder="Amount" required>

            <select id="category" required>
                <option value="">Select Category</option>
                <option>Food</option>
                <option>Transport</option>
                <option>Bills</option>
                <option>Entertainment</option>
                <option>Other</option>
            </select>

            <input type="date" id="expenseDate" required>

            <input type="text" id="note" placeholder="Note (Optional)">

            <button type="submit">Add Expense</button>
        </form>
    </div>

    <div class="card">
        <h2>Filter Expenses</h2>

        <select id="filterCategory">
            <option value="">All Categories</option>
            <option>Food</option>
            <option>Transport</option>
            <option>Bills</option>
            <option>Entertainment</option>
            <option>Other</option>
        </select>

        <input type="date" id="startDate">
        <input type="date" id="endDate">

        <button id="applyFilter">Apply Filter</button>
        <button id="clearFilter">Clear Filter</button>
    </div>

    <div class="card">
        <h2>Expense Summary</h2>

        <p id="totalSpent">Total Spent: ₹0</p>

        <p id="highestExpense">Highest Expense: ₹0</p>

        <div id="categorySummary"></div>
    </div>

    <div class="card">
        <h2>Expense By Category</h2>

        <canvas id="expenseChart"></canvas>
    </div>

    <div class="card">
        <h2>Expenses</h2>

        <label>
            Expenses Per Page:

            <select id="rowsPerPageSelect">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="40">40</option>
            </select>
        </label>

        <table>
            <thead>
                <tr>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Note</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="expenseTable"></tbody>
        </table>

        <div class="pagination">
            <button id="prevPage">Previous</button>
            <span id="pageInfo"></span>
            <button id="nextPage">Next</button>
        </div>
    </div>

    <div class="card">
        <h2>Ask AI</h2>

        <input id="aiQuestion" placeholder="Ask something...">

        <button id="askAiBtn">Ask AI</button>

        <p id="aiAnswer"></p>
    </div>

    <div class="card">
        <button id="premiumBtn">Buy Premium Membership</button>

        <h3 id="premiumMessage" style="display:none;">
            You are a Premium User
        </h3>

        <button id="showLeaderboardBtn" style="display:none;">
            Show Leaderboard
        </button>

        <ul id="leaderboard"></ul>
    </div>

    <div class="card">
        <button id="downloadBtn" style="display:none;">
            Download Expenses CSV
        </button>

        <p id="downloadLink"></p>
    </div>

    <script src="expense.js"></script>

</body>
</html>
